<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wikipedia Interest Analysis</title>
    <style>
      body { font-family: Arial, sans-serif; color: #1f2937; margin: 32px; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      .meta { color: #475569; margin-bottom: 18px; }
      .section { margin-top: 24px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
    </style>
  </head>
  <body>
    <h1>Wikipedia Interest Analysis</h1>
    <div class="meta">Topic: {{topic}} | Languages: {{languages}} | Period: {{period}}</div>

    <div class="section">
      <h2>Main findings</h2>
      <p>{{summary}}</p>
    </div>

    <div class="section">
      <h2>Evidence</h2>
      <table>
        <thead>
          <tr><th>Language</th><th>Trend</th><th>Growth %</th><th>R²</th></tr>
        </thead>
        <tbody>
          {{rows}}
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2>Limitations</h2>
      <ul>
        {{limitations}}
      </ul>
    </div>
  </body>
</html>
